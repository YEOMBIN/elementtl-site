<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>도입 병원 찾기 | 엘레멘트티엘 Gen2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="clinics">
  <header id="site-header"></header>
  <main>
    <section class="subvis">
      <div class="glow" style="width:1200px;height:700px;left:50%;transform:translateX(-50%);top:-260px"></div>
      <div class="laser"></div>
      <div class="wrap" style="position:relative">
        <p class="crumb">HOME › 병원찾기 › <b>도입 병원 찾기</b></p>
        <h1>Find a Clinic</h1>
        <p>도입 병원 찾기</p>
      </div>
    </section>
    <section class="sheet on-light page-body">
      <div class="wrap">
        <div class="clinic-intro">
          <h2 class="h2"><b>가까운 엘레멘트티엘 도입 병원을 찾아보세요</b></h2>
          <p class="body">병원명 노출에 동의한 의료기관만 안내합니다. 진료 및 시술 상담은 각 병원으로 문의해 주세요.</p>
        </div>
        <div class="clinic-filter">
          <div class="chips" data-chips><a class="chip is-active" href="#">전체</a><a class="chip" href="#">서울</a><a class="chip" href="#">경기</a><a class="chip" href="#">인천</a><a class="chip" href="#">대전</a><a class="chip" href="#">울산</a><a class="chip" href="#">부산</a><a class="chip" href="#">기타</a></div>
          <form class="search" role="search"><input type="search" placeholder="병원명 · 지역 검색" style="border-left:0"><button aria-label="검색"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button></form>
        </div>
        <div class="clinic-split">
          <div class="clinic-list" aria-live="polite"><!-- assets/js/clinics.js 의 병원 데이터로 채워집니다 --></div>
          <div class="map">
            <div id="clinic-map" class="map__canvas" aria-label="도입 병원 지도"></div>
            <span class="map__label">지역 기준 위치 · 정확한 주소는 확정 후 반영</span>
            <div class="map__zoom"><button type="button" data-zoom="in" aria-label="지도 확대">+</button><button type="button" data-zoom="out" aria-label="지도 축소">−</button></div>
          </div>
        </div>
        <div class="clinic-cta">
          <div><h3 class="h3">우리 병원도 엘레멘트티엘을 도입하고 싶다면</h3><p>도입 조건 · 데모 일정은 전문 담당자가 안내합니다.</p></div>
          <a class="btn btn--primary btn--sm" href="inquiry.html">제품 도입 문의 <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></a>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/js/clinics.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
