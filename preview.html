<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>엘레멘트티엘 홈페이지 시안 검토</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { --bg: #000724; --panel: #0b1530; --line: rgba(255,255,255,.1); --txt: #fff; --sub: rgba(255,255,255,.6); --blue: #2f6bff; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--txt); font-family: "Pretendard", -apple-system, sans-serif; letter-spacing: -0.03em; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; padding: 18px 28px; background: rgba(0,7,36,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); }
    header h1 { font-size: 16px; font-weight: 600; }
    header h1 small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--sub); }
    .group { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; }
    .group button { padding: 8px 14px; border: 0; border-radius: 999px; background: none; color: var(--sub); font: inherit; font-size: 13px; cursor: pointer; }
    .group button.on { background: #fff; color: #0b1530; font-weight: 600; }
    .open { margin-left: auto; padding: 9px 16px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 13px; text-decoration: none; }
    main { display: flex; justify-content: center; padding: 32px 20px 60px; }
    .device { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.45); transition: width .5s ease-in-out, height .5s ease-in-out; }
    .device iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
    .note { position: fixed; left: 20px; bottom: 16px; font-size: 12px; color: var(--sub); }
    @media (max-width: 760px) { header { padding: 14px 16px; } .open { margin-left: 0; } .note { display: none; } }
  </style>
</head>
<body>
  <header>
    <h1>엘레멘트티엘 Gen2 홈페이지 시안<small>검토용 · 실제 서비스 화면이 아닙니다</small></h1>
    <div class="group" id="pages">
      <button data-p="index.html" class="on">메인</button>
      <button data-p="product.html">제품소개</button>
      <button data-p="press.html">보도자료</button>
      <button data-p="conference.html">학회 &amp; 전시</button>
      <button data-p="blog.html">블로그</button>
      <button data-p="inquiry.html">제품 도입 문의</button>
      <button data-p="demo.html">데모 신청</button>
      <button data-p="clinics.html">도입 병원 찾기</button>
    </div>
    <div class="group" id="devices">
      <button data-w="1440" class="on">PC</button>
      <button data-w="768">Tablet</button>
      <button data-w="390">Mobile</button>
    </div>
    <a class="open" id="open" href="index.html" target="_blank" rel="noopener">새 창으로 보기</a>
  </header>
  <main><div class="device" id="device"><iframe id="frame" src="index.html" title="시안 미리보기"></iframe></div></main>
  <p class="note">PC 화면은 창 크기에 맞춰 축소해 보여 줍니다.</p>
  <script>
    const frame = document.getElementById('frame'), device = document.getElementById('device'), open = document.getElementById('open');
    let page = 'index.html', width = 1440;
    function layout() {
      const availW = Math.min(window.innerWidth - 40, 1440);
      const availH = window.innerHeight - document.querySelector('header').offsetHeight - 92;
      const scale = Math.min(1, availW / width);
      const h = width === 1440 ? availH / scale : Math.min(availH, width === 390 ? 844 : 1024);
      frame.style.width = width + 'px';
      frame.style.height = h + 'px';
      frame.style.transform = `scale(${scale})`;
      device.style.width = width * scale + 'px';
      device.style.height = h * scale + 'px';
    }
    function pick(group, attr, fn) {
      document.querySelectorAll(`#${group} button`).forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll(`#${group} button`).forEach(x => x.classList.toggle('on', x === b));
        fn(b.dataset[attr]);
      }));
    }
    pick('pages', 'p', p => { page = p; frame.src = p; open.href = p; });
    pick('devices', 'w', w => { width = +w; layout(); });
    const q = new URLSearchParams(location.search);
    if (q.get('page')) document.querySelector(`#pages button[data-p="${q.get('page')}"]`)?.click();
    if (q.get('w')) document.querySelector(`#devices button[data-w="${q.get('w')}"]`)?.click();
    window.addEventListener('resize', layout);
    layout();
  </script>
</body>
</html>
